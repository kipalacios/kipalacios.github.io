# Media Specializations page (_includes/portfolio/peso_gallery.liquid).
# One section per PESO channel, in this order. Each section shows:
#   1. every campaign pillar with a matching `key` (pulled automatically from
#      _portfolio/*.md `pillars`, titled by its `headline`), then
#   2. the extra `work` listed here: real-world pieces that aren't part of a
#      PESO campaign (add new ones here).
# DRAFT wording: replace any `blurb`, `teaser` or `headline` with your own.

- key: paid
  label: Paid
  title: Paid Media
  blurb: "Media placed with a budget behind it: ads, out-of-home and sponsored social."
  work:
