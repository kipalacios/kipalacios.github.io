# SITE CONFIGURATION
baseurl: ""
url: "https://klarissapalacios.com"

# THEME-SPECIFIC CONFIGURATION
title: Klarissa Palacios — Public Relations              # site's title (browser tab, SEO, logo alt text)
description: "Portfolio of PR and advertising campaigns by Klarissa Palacios." # used by search engines
avatar: assets/img/kppr-logo.png                         # Empty for no avatar in navbar
favicon: assets/favicon.ico                             # Icon displayed in the tab

# Header and footer text
header_text: Create More Than You Consume                # Home page banner text
header_feature_image: assets/img/kppr-logo.png            # Fallback social-share image (og:image) — the KPPR logo
# Footer content lives directly in _includes/default/footer.liquid now (name,
# tagline, nav, icons, copyright) — footer_text is no longer used.

# Home page intro (below the banner)
intro_name: Klarissa Palacios
intro_name_suffix: Public Relations
intro_bio: >
  I'm a Los Angeles–based strategic communicator and storyteller who believes in creating
  more than you consume — crafting accessible ways to tell stories so audiences of every
  background and ability can connect.

# Blog
excerpt: true                                           # Or "truncate" (first 250 characters), "false" to disable
post_navigation: true
color_image: /assets/img/lineart.png                    # A bit transparent for color posts.

# Features
# More in the _data folder for comments, share buttons, author and language
# For layout customization, go to the "_sass > base" folder, and check "_variables.scss"
katex: true                                             # Enable if using math markup
mermaid: default                                        # Enable mermaid-js for diagrams, use theme: base, forest, dark, default, neutral
google_analytics:                                       # Measurement ID, e.g. "G-00000"
cookie_consent: false                                   # To respect the usage of cookies
color_theme: light                                      # auto, dark or light

# PAGINATION
paginate: 5
paginate_path: "/blog/page:num"

# PORTFOLIO
collections:
  portfolio:
    output: true
    permalink: /:collection/:name

# BUILD SETTINGS
sass:
  style: compressed
  quiet_deps: true
plugins: [jekyll-paginate, jekyll-seo-tag, jekyll-feed]
exclude:
  - ".idea"
  - ".jekyll-cache"
  - ".jekyll-metadata"
  - ".sass-cache"
  - "Gemfile"
  - "Gemfile.lock"
  - "type-on-strap.gemspec"
  - "vendor"
  - "node_modules"
  - "assets/node_modules"
  - "assets/Dockerfile"
  - "package.json"
  - "package-lock.json"
  - "README.md"
  - "LICENSE"
  - ".github"
  - "test-results"

# theme: type-on-strap                                  # if using the theme as a jekyll theme gem
remote_theme: sylhare/Type-on-Strap                     # If using as a remote_theme in github
