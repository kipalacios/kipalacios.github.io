      source: "CAVA x Bumble &middot; Concept campaign"
      teaser: >
        One shared idea, "Find Your Flavor," carried across brand copy, paid social and
        out-of-home creative for a two-brand promotion.
      items: [Paid social, OOH creative, Brand copy]
      url: /portfolio/cava-bumble/
      cta: See the campaign

- key: earned
